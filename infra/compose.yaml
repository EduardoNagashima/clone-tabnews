services:
  database:
    container_name: "postgres-dev"
    image: "postgres:16.2-alpine3.19"
    env_file:
      - ../.env.development
    ports:
      - "5432:5432"
  mailcatcher:
    container_name: "mailcatcher-dev"
    image: "sj26/mailcatcher"
    env_file:
      - ../.env.development
    ports:
      - "1080:1080"
      - "1025:1025"
